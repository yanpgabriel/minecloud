services:
  papermc:
    image: yanpgabriel/minecloud
    build:
        context: ./
        dockerfile: Dockerfile
        args:
            UID: 1000
            GID: 1000
    restart: unless-stopped
    tty: true
    stdin_open: true
    stop_grace_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    ports:
      - "25565:25565"
    environment:
      EULA: "TRUE"
      VERSION: "26.2"
      BUILD: latest
      PAPERMC_START_MEMORY: 1G
      PAPERMC_MAX_MEMORY: 4G
    volumes:
      - ./minecraft:/minecraft
